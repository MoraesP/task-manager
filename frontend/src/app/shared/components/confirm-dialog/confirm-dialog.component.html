<div class="modal modal--sm">
  <div class="modal__head">
    @if (data.danger) {
      <span class="modal__head-icon modal__head-icon--danger">
        <app-icon name="alert" [size]="20" [stroke]="1.8" />
      </span>
    }
    <h3 class="modal__title">{{ data.title }}</h3>
  </div>
  <div class="modal__body">
    <p class="modal__text">{{ data.message }}</p>
  </div>
  <div class="modal__foot">
    <button class="btn btn--ghost" (click)="ref.close(false)">Cancelar</button>
    <button
      class="btn"
      [class.btn--danger]="data.danger"
      [class.btn--primary]="!data.danger"
      (click)="ref.close(true)"
    >
      {{ data.confirmLabel ?? 'Confirmar' }}
    </button>
  </div>
</div>
