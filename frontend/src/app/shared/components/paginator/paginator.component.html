@if (totalDePaginas() > 1 || total() > 0) {
  <div class="paginator">
    <button
      class="paginator__btn"
      [disabled]="pagina() === 0"
      (click)="irPara.emit(pagina() - 1)"
      aria-label="Anterior"
    >
      <app-icon nome="chevron-left" [tamanho]="14" [traco]="2.4" />
    </button>
    <span class="paginator__range">{{ de() }}–{{ ate() }} de {{ total() }}</span>
    <button
      class="paginator__btn"
      [disabled]="pagina() >= totalDePaginas() - 1"
      (click)="irPara.emit(pagina() + 1)"
      aria-label="Próxima"
    >
      <app-icon nome="chevron-right" [tamanho]="14" [traco]="2.4" />
    </button>
  </div>
}
