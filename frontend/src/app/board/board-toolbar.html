<div class="toolbar">
  <label class="search">
    <app-icon name="search" [size]="15" [stroke]="1.8" />
    <input type="search" [formControl]="search" placeholder="Buscar tarefas por título ou descrição…" />
  </label>

  <form [formGroup]="filters" (change)="apply()" class="filters">
    <select class="input sm" formControlName="status" aria-label="Status">
      <option value="">Status: todos</option>
      @for (s of statuses; track s) { <option [value]="s">{{ statusLabel[s] }}</option> }
    </select>
    <select class="input sm" formControlName="priority" aria-label="Prioridade">
      <option value="">Prioridade: todas</option>
      @for (p of priorities; track p) { <option [value]="p">{{ priorityLabel[p] }}</option> }
    </select>
    <select class="input sm" formControlName="assigneeId" aria-label="Responsável">
      <option value="">Responsável: todos</option>
      @for (m of members(); track m.userId) { <option [value]="m.userId">{{ m.name }}</option> }
    </select>
    <input class="input sm" type="date" formControlName="deadlineFrom" aria-label="Prazo de" title="Prazo de" />
    <input class="input sm" type="date" formControlName="deadlineTo" aria-label="Prazo até" title="Prazo até" />
    <select class="input sm sort" formControlName="sort" aria-label="Ordenar">
      <option value="priority,desc">Ordenar: prioridade</option>
      <option value="createdAt,desc">Ordenar: mais recentes</option>
      <option value="createdAt,asc">Ordenar: mais antigas</option>
      <option value="deadline,asc">Ordenar: prazo</option>
    </select>
  </form>

  <div class="spacer"></div>
  <button class="btn primary" (click)="newTask.emit()">
    <app-icon name="plus" [size]="15" [stroke]="2.2" /> Nova tarefa
  </button>
</div>
