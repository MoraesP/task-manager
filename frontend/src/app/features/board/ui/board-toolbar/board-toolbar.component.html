<div class="board-toolbar">
  <label class="board-toolbar__search">
    <app-icon nome="search" [tamanho]="15" [traco]="1.8" />
    <input type="search" [formControl]="campoDeBusca" placeholder="Buscar tarefas por título ou descrição…" />
  </label>

  <form class="board-toolbar__filters" [formGroup]="filtros" (change)="aplicar()">
    <select class="input input--sm" formControlName="status" aria-label="Status">
      <option value="">Status: todos</option>
      @for (status of statusDisponiveis; track status) {
        <option [value]="status">{{ rotuloDeStatus[status] }}</option>
      }
    </select>
    <select class="input input--sm" formControlName="priority" aria-label="Prioridade">
      <option value="">Prioridade: todas</option>
      @for (prioridade of prioridades; track prioridade) {
        <option [value]="prioridade">{{ rotuloDePrioridade[prioridade] }}</option>
      }
    </select>
    <select class="input input--sm" formControlName="assigneeId" aria-label="Responsável">
      <option value="">Responsável: todos</option>
      @for (membro of membros(); track membro.userId) {
        <option [value]="membro.userId">{{ membro.name }}</option>
      }
    </select>
    <input class="input input--sm" type="date" formControlName="deadlineFrom" aria-label="Prazo de" title="Prazo de" />
    <input class="input input--sm" type="date" formControlName="deadlineTo" aria-label="Prazo até" title="Prazo até" />
    <select class="input input--sm board-toolbar__sort" formControlName="sort" aria-label="Ordenar">
      <option value="priority,desc">Ordenar: prioridade</option>
      <option value="createdAt,desc">Ordenar: mais recentes</option>
      <option value="createdAt,asc">Ordenar: mais antigas</option>
      <option value="deadline,asc">Ordenar: prazo</option>
    </select>
  </form>

  <span class="board-toolbar__spacer"></span>
  <button class="btn btn--primary" (click)="novaTarefa.emit()">
    <app-icon nome="plus" [tamanho]="15" [traco]="2.2" /> Nova tarefa
  </button>
</div>
