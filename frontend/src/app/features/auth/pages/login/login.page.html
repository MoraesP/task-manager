<app-auth-card>
  <h1 class="login__title">Entrar</h1>
  <p class="login__lead">Acesse seus projetos e tarefas.</p>

  <form class="login__form" [formGroup]="form" (ngSubmit)="enviar()">
    <div class="field">
      <label class="field__label" for="email">E-mail</label>
      <input id="email" class="input" type="email" formControlName="email" autocomplete="email" />
    </div>
    <div class="field">
      <label class="field__label" for="senha">Senha</label>
      <div class="login__password">
        <input
          id="senha"
          class="input"
          [type]="mostrarSenha() ? 'text' : 'password'"
          formControlName="password"
          autocomplete="current-password"
        />
        <button
          type="button"
          class="login__eye"
          (click)="mostrarSenha.set(!mostrarSenha())"
          aria-label="Mostrar senha"
        >
          <app-icon nome="eye" [tamanho]="17" />
        </button>
      </div>
    </div>
    <button class="btn btn--primary btn--block btn--lg" type="submit" [disabled]="form.invalid || carregando()">
      @if (carregando()) {
        <app-spinner [tamanho]="15" />
      } @else {
        Entrar
      }
    </button>
  </form>

  <div class="login__sep"><span>novo por aqui?</span></div>
  <a routerLink="/cadastro" class="login__alt">Criar uma conta</a>
</app-auth-card>
