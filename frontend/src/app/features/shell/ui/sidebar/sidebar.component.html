<aside class="sidebar" [class.sidebar--dim-project]="secao() === 'projetos'">
  <div class="sidebar__brand">
    <app-icon nome="board" [tamanho]="20" [traco]="1.7" />
    <span>Task Manager</span>
  </div>

  <nav class="sidebar__nav">
    <a
      class="sidebar__item"
      routerLink="/projetos"
      [class.sidebar__item--active]="secao() === 'projetos'"
      (click)="fechar()"
    >
      <app-icon nome="folder" [tamanho]="18" [traco]="1.6" /> Projetos
    </a>
  </nav>

  @if (projeto(); as projetoAtual) {
    <div class="sidebar__project">
      <div class="sidebar__label">Projeto</div>
      <button class="sidebar__switch" (click)="irParaProjetos()">
        <span class="sidebar__switch-name">{{ projetoAtual.name }}</span>
        <app-role-badge [valor]="projetoAtual.role" />
        <app-icon nome="chevron-down" [tamanho]="14" [traco]="2" />
      </button>
      <nav class="sidebar__nav">
        <a
          class="sidebar__item"
          [routerLink]="['/projetos', projetoAtual.id, 'quadro']"
          [class.sidebar__item--active]="secao() === 'quadro'"
          (click)="fechar()"
        >
          <app-icon nome="board" [tamanho]="18" [traco]="1.6" /> Quadro
        </a>
        <a
          class="sidebar__item"
          [routerLink]="['/projetos', projetoAtual.id, 'relatorio']"
          [class.sidebar__item--active]="secao() === 'relatorio'"
          (click)="fechar()"
        >
          <app-icon nome="chart" [tamanho]="18" [traco]="1.6" /> Relatório
        </a>
        <a
          class="sidebar__item"
          [routerLink]="['/projetos', projetoAtual.id, 'membros']"
          [class.sidebar__item--active]="secao() === 'membros'"
          (click)="fechar()"
        >
          <app-icon nome="users" [tamanho]="18" [traco]="1.6" /> Membros
        </a>
        @if (projetoAtual.role === 'ADMIN') {
          <a
            class="sidebar__item"
            [routerLink]="['/projetos', projetoAtual.id, 'configuracoes']"
            [class.sidebar__item--active]="secao() === 'configuracoes'"
            (click)="fechar()"
          >
            <app-icon nome="settings" [tamanho]="18" [traco]="1.6" /> Configurações
          </a>
        }
      </nav>
    </div>
  }

  <div class="sidebar__spacer"></div>

  <button class="sidebar__user" (click)="sair()">
    <app-avatar [nome]="nomeDoUsuario()" [tamanho]="26" />
    <span class="sidebar__user-name">{{ nomeDoUsuario() }}</span>
    <app-icon nome="logout" [tamanho]="15" [traco]="1.8" />
  </button>
</aside>
